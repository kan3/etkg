name: Account and Key Generator

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Number of accounts (0 skips account generation)'
        default: '0'
        type: string
      key:
        description: 'Number of keys (0 skips key generation)'
        default: '1'
        type: string
      mail:
        description: 'Email provider'
        required: true
        type: choice
        options: [1secmail, guerrillamail, developermail, mailticking, fakemail, inboxes, incognitomail, emailfake]
        default: emailfake
      key_type:
        description: 'Mode of operation'
        type: choice
        options: ['--key', '--small-business-key']
        default: '--key'
      os:
        description: 'Runner operating system'
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
        default: windows-latest
      mail_only:
        description: 'Check mail initialization only; do not register accounts or request keys'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-account-and-key:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout selected branch of this fork
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run script
        env:
          ACCOUNT_COUNT: ${{ inputs.account }}
          KEY_COUNT: ${{ inputs.key }}
          EMAIL_PROVIDER: ${{ inputs.mail }}
          KEY_MODE: ${{ inputs.key_type }}
          MAIL_ONLY: ${{ inputs.mail_only }}
        run: python scripts/run_ci.py
